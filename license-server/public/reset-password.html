<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vixor License Admin — Reset Password</title>
<style>
  :root{ --navy:#0e1642; --orange:#F2701C; --ink:#15191c; --ink-soft:#5c665f; --paper:#f5f6fa; --line:#e2e5ee; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:system-ui,sans-serif; background:var(--paper); color:var(--ink); }
  header{ background:var(--navy); color:#fff; padding:16px 24px; }
  header b{ color:var(--orange); }
  .wrap{ max-width:420px; margin:60px auto 0; padding:0 24px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px; }
  input{ padding:9px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; width:100%; margin-bottom:12px; }
  button{ background:var(--navy); color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-size:13.5px; font-weight:600; width:100%; }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:#b3261e; font-size:13px; margin-top:10px; }
  .success{ color:#1a7a3c; font-size:13.5px; margin-top:10px; }
  .hint{ color:var(--ink-soft); font-size:12.5px; margin:0 0 16px; }
  label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }
  .hidden{ display:none; }
</style>
</head>
<body>

<header><span>VIXOR <b>LICENSE ADMIN</b></span></header>

<div class="wrap">
  <div class="card">
    <h3 style="margin-top:0">Set a new password</h3>
    <p class="hint" id="hint">Checking your reset link…</p>

    <form id="resetForm" class="hidden">
      <label>Username</label>
      <input id="username" disabled>
      <label>New password</label>
      <input id="newPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      <label>Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password">
      <button id="submitBtn" type="submit">Set new password</button>
      <div id="msg"></div>
    </form>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const username = params.get('username');
const token = params.get('token');
const hint = document.getElementById('hint');
const form = document.getElementById('resetForm');
const msg = document.getElementById('msg');

if (!username || !token) {
  hint.textContent = 'This link is missing its username or token — generate a fresh one with scripts/generate-reset-token.js on the server.';
} else {
  hint.textContent = 'This link is valid for 1 hour from when it was generated.';
  document.getElementById('username').value = username;
  form.classList.remove('hidden');
}

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.innerHTML = '';
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword.length < 8) {
    msg.innerHTML = '<div class="error">Password must be at least 8 characters.</div>';
    return;
  }
  if (newPassword !== confirmPassword) {
    msg.innerHTML = '<div class="error">Passwords do not match.</div>';
    return;
  }

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Setting password…';

  try {
    const res = await fetch('/admin/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, token, newPassword }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Reset failed');
    msg.innerHTML = '<div class="success">Password updated. You can now sign in with it at <a href="/admin-ui/admin.html">the admin panel</a>.</div>';
    form.querySelector('button').style.display = 'none';
  } catch (err) {
    msg.innerHTML = `<div class="error">${err.message}</div>`;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Set new password';
  }
});
</script>
</body>
</html>
